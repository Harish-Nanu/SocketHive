[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sockethive"
version = "0.1.0"
description = "A scalable, multithreaded TCP/IP client-server system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ScientistVaseegaran", email = "harishnanu.official@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.17.1"]

[project.scripts]
sockethive = "sockethive.cli:main"

[tool.setuptools.packages.find]
include = ["sockethive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
